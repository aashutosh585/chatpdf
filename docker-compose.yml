services:
  backend:
    build:
      context: .
      dockerfile: dockerfile
    env_file:
      - ${BACKEND_ENV_FILE:-./server/.env}
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: /
    env_file:
      - ${FRONTEND_ENV_FILE:-./frontend/.env}
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend
    restart: unless-stopped
