name: CI/CD

on:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint --if-present

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install backend dependencies
        working-directory: server
        run: npm ci --legacy-peer-deps

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "."
          target: "/opt/chatpdf"

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            
            # 1. Install nginx if it's missing
            if ! command -v nginx > /dev/null; then
              sudo apt update
              sudo apt install -y nginx
            fi
            
            # 2. Check for secrets
            test -f /secret/.env_backend || (echo "/secret/.env_backend missing" && exit 1)
            export BACKEND_ENV_FILE=/secret/.env_backend
            
            # Create frontend secrets file if it doesn't exist, and export it for docker-compose
            test -f /secret/.env_frontend || sudo touch /secret/.env_frontend
            export FRONTEND_ENV_FILE=/secret/.env_frontend
            
            # 3. Build and deploy containers
            cd /opt/chatpdf
            docker compose build --pull
            docker compose up -d
            docker image prune -f
            docker compose ps
            
            # 4. Setup and Reload Nginx
            sudo cp nginx/chatpdf.conf /etc/nginx/sites-available/chatpdf
            sudo ln -sfn /etc/nginx/sites-available/chatpdf /etc/nginx/sites-enabled/chatpdf
            sudo rm -f /etc/nginx/sites-enabled/default
            sudo nginx -t
            sudo systemctl enable --now nginx
            sudo systemctl reload nginx

